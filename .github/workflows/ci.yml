name: CI/CD

on:
  pull_request:
    branches:
      - develop
      - master
    types:
      - opened
      - synchronize
      - reopened
      - closed
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-master-source:
    name: Validate master source
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.base.ref == 'master'

    steps:
      - name: Require develop as source branch
        if: github.event.pull_request.head.ref != 'develop'
        run: |
          echo "Only pull requests from develop can target master."
          exit 1

      - name: Source branch allowed
        if: github.event.pull_request.head.ref == 'develop'
        run: echo "Source branch is develop."

  checks:
    name: Checks
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:8080
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci_nextauth_secret

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: checks
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.head.ref == 'develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Deploy production to Vercel
        run: npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
